<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ocean's Call | Mohali Institute of Sciences</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #fcfaf8;
        --card: #ffffff;
        --text: #241316;
        --muted: #6f5f63;
        --line: #e7dadc;
        --accent: #7c2430;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
      }

      .container {
        width: min(96vw, 1440px);
        margin: 0 auto;
        padding: 18px 0 26px;
      }

      .site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 4px 18px;
        margin-bottom: 18px;
        background: transparent;
        border: 1px solid var(--line);
        border-width: 0 0 1px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }

      .brand img {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand-text strong {
        font-size: 1.02rem;
        letter-spacing: 0.01em;
      }

      .brand-text span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .site-shell {
        background: var(--card);
        border: 1px solid var(--line);
        padding: 26px 28px;
      }

      h1, h2, h3 {
        line-height: 1.2;
      }

      a {
        color: var(--accent);
      }

      main {
        min-height: 40vh;
      }

      .page-footer {
        padding: 18px 4px 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 768px) {
        .container {
          width: min(96vw, 1440px);
          padding: 12px 0 18px;
        }

        .site-shell {
          padding: 20px;
        }

        .site-nav {
          padding: 12px 2px 16px;
        }

        .brand-text strong {
          font-size: 0.98rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="/">
          <img src="/assets/images/logo.png" alt="Mohali Institute of Sciences logo">
          <div class="brand-text">
            <strong>Mohali Institute of Sciences</strong>
            <span>School of Computer Sciences</span>
          </div>
        </a>
      </nav>

      <div class="site-shell">
        <main>
          <p>This is a journal entry about the ocean.</p>

        </main>
      </div>

      <footer class="page-footer">
        <p>&copy; 2026 Mohali Institute of Sciences</p>
      </footer>
    </div>
  </body>
</html>
